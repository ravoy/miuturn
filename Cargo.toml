[package]
name = "miuturn"
version = "0.1.4"
edition = "2024"
description = "A high-performance TURN server implemented in Rust, designed for WebRTC applications."
authors = ["jinti<shenjindi@fourz.cn>"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
async-trait = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"
tower-http = { version = "0.6", features = ["cors"] }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
webrtc-util = "0.17.2"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
md5 = "0.8.1"
hex = "0.4"
base64 = "0.22"
rand = "0.10.2"
p256 = { version = "0.13", features = ["pkcs8"] }

# TLS support
tokio-rustls = "0.26"
rustls = "0.23"
dtls = { version = "0.17.2", features = ["pem"] }
pem = "3"
rcgen = "0.14.8"
x509-parser = "0.18"

# Prometheus metrics (custom implementation)
prometheus = "0.14.0"

# Time utilities
time = "0.3"

# CPU detection for worker pool sizing
num_cpus = "0.2"

# Session management for admin console
axum-extra = { version = "0.9", features = ["cookie"] }

[dev-dependencies]
stun = "0.17.2"
turn = "0.17.2"
tokio-test = "0.4"
tower = "0.5"
anyhow = "1"
futures = "0.3"
rustrtc = "0.3"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
